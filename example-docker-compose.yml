# docker-compose example for TenderDuty v2 Roomit
# Copy to docker-compose.yml, create conf/config.yml, then:
#   docker compose up -d --build
# FHS layout:
#   ./conf/config.yml          — chain config
#   ./bin/tenderduty           — binary (inside container)
#   ./var/www/td2-v2/          — dashboard static files

version: "3.8"

services:
  tenderduty:
    build: .
    container_name: tenderduty-v2
    ports:
      - "8888:8888"   # Dashboard
      - "28686:28686" # Prometheus exporter
    volumes:
      - ./conf/config.yml:/app/conf/config.yml:ro
    environment:
      - CONFIG=/app/conf/config.yml
      - TENDERDUTY_STATIC_DIR=/app/var/www/td2-v2
      - TZ=Asia/Jakarta
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/state"]
      interval: 30s
      timeout: 10s
      retries: 3
