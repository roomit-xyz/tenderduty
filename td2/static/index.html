<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TenderDuty v2</title>
<style>
:root{--bg:#0F172A;--surface:#1E293B;--surface2:#334155;--text:#F8FAFC;--text2:#94A3B8;--text3:#64748B;--green:#10B981;--green-glow:#10B98140;--amber:#F59E0B;--amber-glow:#F59E0B40;--red:#EF4444;--red-glow:#EF444440;--blue:#3B82F6;--blue-glow:#3B82F640;--radius:16px}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px;margin:0}
.container{max-width:1500px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.header h1{font-size:1.5rem;font-weight:700}
.header h1 span{color:var(--green)}
.status-pill{display:flex;align-items:center;gap:8px;background:var(--surface);padding:6px 14px;border-radius:100px;font-size:0.75rem}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:16px;border:1px solid var(--surface2)}
.stat-card .label{font-size:0.68rem;color:var(--text3);text-transform:uppercase;margin-bottom:4px}
.stat-card .value{font-size:1.5rem;font-weight:700}
.stat-card .value.green{color:var(--green)}.stat-card .value.amber{color:var(--amber)}.stat-card .value.red{color:var(--red)}
.legend-bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;background:var(--surface);border-radius:var(--radius);padding:10px 16px;border:1px solid var(--surface2);font-size:0.72rem;color:var(--text2);align-items:center}
.legend-dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:4px}
.legend-dot.signed{background:var(--green)}.legend-dot.proposed{background:var(--blue)}.legend-dot.missed{background:var(--red)}.legend-dot.none{background:var(--surface2)}
.main-grid{display:grid;grid-template-columns:1fr 300px;gap:18px}
.chains-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.chain-card{background:var(--surface);border-radius:var(--radius);padding:20px;border:1px solid var(--surface2);position:relative;overflow:hidden;transition:all .25s}
.chain-card:hover{border-color:var(--green);box-shadow:0 0 16px var(--green-glow);transform:translateY(-2px)}
.chain-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--green)}
.chain-card.warning::before{background:var(--amber)}.chain-card.critical::before{background:var(--red)}
.chain-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.chain-name{font-size:1rem;font-weight:600}
.chain-status{font-size:0.7rem;padding:2px 10px;border-radius:100px}
.chain-status.healthy{background:#10B98120;color:var(--green)}.chain-status.warning{background:#F59E0B20;color:var(--amber)}.chain-status.critical{background:#EF444420;color:var(--red)}
.chain-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.meta-item .label{font-size:0.65rem;color:var(--text3);text-transform:uppercase}
.meta-item .value{font-size:0.82rem;font-weight:500;color:var(--text2)}
.meta-item .value.highlight{color:var(--text)}
.blocks-container{margin-top:10px}
.blocks-label{font-size:0.65rem;color:var(--text3);text-transform:uppercase;margin-bottom:6px}
.blocks-row{display:flex;gap:3px;flex-wrap:wrap}
.block{width:11px;height:24px;border-radius:3px;background:var(--surface2);transition:all .25s cubic-bezier(0.34,1.56,0.64,1);cursor:default}
.block.signed{background:var(--green);animation:blockGlow 3s ease-in-out infinite}
.block.missed{background:var(--red)}
.block.proposed{background:var(--blue);animation:blockPulse 2s ease-in-out infinite}
.block:hover{transform:scaleY(1.6) scaleX(1.2)}
@keyframes blockGlow{0%,100%{box-shadow:0 0 4px var(--green-glow)}50%{box-shadow:0 0 12px var(--green-glow),0 0 20px rgba(16,185,129,0.15)}}
@keyframes blockPulse{0%,100%{box-shadow:0 0 4px var(--blue-glow)}50%{box-shadow:0 0 10px var(--blue-glow),0 0 16px rgba(59,130,246,0.15)}}
.sidebar{display:flex;flex-direction:column;gap:16px}
.log-panel{background:var(--surface);border-radius:var(--radius);border:1px solid var(--surface2);padding:16px;max-height:520px;display:flex;flex-direction:column}
.log-panel h3{font-size:0.8rem;font-weight:600;margin-bottom:10px;color:var(--text2)}
.log-list-scroll{flex:1;overflow-y:auto;min-height:350px}
.log-list{display:flex;flex-direction:column;gap:4px;font-size:0.68rem;font-family:monospace}
.log-item{padding:5px 8px;background:var(--surface2);border-radius:4px;border-left:3px solid var(--text3);line-height:1.35;word-break:break-all;color:var(--text2)}
.log-item.info{border-left-color:var(--blue)}.log-item.ok{border-left-color:var(--green)}.log-item.warn{border-left-color:var(--amber)}.log-item.error{border-left-color:var(--red)}
.footer{margin-top:28px;text-align:center;font-size:0.68rem;color:var(--text3)}
</style>
</head>
<body>
<div class="container">
<div class="header">
  <h1>Tender<span>Duty</span></h1>
  <div class="status-pill"><div class="status-dot"></div><span id="ws-status">Connecting</span></div>
</div>
<div class="stats-bar">
  <div class="stat-card"><div class="label">Chains</div><div class="value" id="total-chains">0</div></div>
  <div class="stat-card"><div class="label">Healthy</div><div class="value green" id="healthy-count">0</div></div>
  <div class="stat-card"><div class="label">Warning</div><div class="value amber" id="warning-count">0</div></div>
  <div class="stat-card"><div class="label">Critical</div><div class="value red" id="critical-count">0</div></div>
</div>
<div class="legend-bar">
  <span class="legend-dot signed"></span>Signed
  <span class="legend-dot proposed"></span>Proposed
  <span class="legend-dot missed"></span>Missed
  <span class="legend-dot none"></span>None
</div>
<div class="main-grid">
  <div class="chains-grid" id="chains-grid"></div>
  <div class="sidebar">
    <div class="log-panel">
      <h3>📋 Live Logs</h3>
      <div class="log-list-scroll"><div class="log-list" id="logs-list"></div></div>
    </div>
  </div>
</div>
</div>
<div class="footer">TenderDuty v2 · Roomit</div>
<script>
const HOST=location.hostname;
const STATE_URL = 'http://'+HOST+':8888/state';
const LOGS_URL  = 'http://'+HOST+':8888/logs';
const WS_URL    = 'ws://'+HOST+':8888/ws';
let chains = {};
const v = (o,k) => o[k] ?? o[k.toLowerCase()];
function addLog(msg, level, ts) {
  const el = document.getElementById('logs-list');
  const d = document.createElement('div');
  d.className = 'log-item ' + (level||'info');
  const t = ts ? new Date(ts*1000).toLocaleTimeString() : new Date().toLocaleTimeString();
  d.innerHTML = '<span style="color:var(--text3);font-size:0.62rem">' + t + '</span> ' + msg;
  el.insertBefore(d, el.firstChild);
  if(el.children.length > 100) el.removeChild(el.lastChild);
}
function getHealthy(ch) {
  const nodes = v(ch,'HealthyNodes')||v(ch,'healthy_nodes');
  if(nodes !== undefined && nodes === 0) return 'critical';
  const err = v(ch,'LastError')||v(ch,'last_error');
  if(err) return 'critical';
  const missed = v(ch,'Missed')||v(ch,'missed')||0;
  if(missed > 2) return 'warning';
  return 'healthy';
}
const blockMap = {0:'missed',1:'none',2:'none',3:'signed',4:'proposed'};
function render() {
  const list = Object.values(chains).sort((a,b)=>(v(a,'Name')||'').localeCompare(v(b,'Name')||''));
  let hh=0,ww=0,cc=0;
  if(!list.length) {
    document.getElementById('chains-grid').innerHTML = '<div style="color:var(--text3);padding:20px">Waiting for chain data…</div>';
    return;
  }
  document.getElementById('chains-grid').innerHTML = list.map(ch=>{
    const st = getHealthy(ch);
    if(st==='healthy') hh++; else if(st==='warning') ww++; else cc++;
    const blocks = (v(ch,'Blocks')||[]).slice(-65).map(b=>{
      const cls = blockMap[b] || 'none';
      return `<div class="block ${cls}"></div>`;
    }).join('');
    return `<div class="chain-card ${st}">
      <div class="chain-header">
        <div class="chain-name">${v(ch,'Name')||v(ch,'name')||'?'}</div>
        <div class="chain-status ${st}">${st.toUpperCase()}</div>
      </div>
      <div class="chain-meta">
        <div class="meta-item"><span class="label">Height</span><span class="value highlight">${Number(v(ch,'Height')).toLocaleString()}</span></div>
        <div class="meta-item"><span class="label">Missed</span><span class="value">${(v(ch,'Missed')||0)}/${(v(ch,'Window')||'?')}</span></div>
      </div>
      <div class="blocks-container"><div class="blocks-label">Blocks</div><div class="blocks-row">${blocks}</div></div>
    </div>`;
  }).join('');
  document.getElementById('total-chains').textContent=list.length;
  document.getElementById('healthy-count').textContent=hh;
  document.getElementById('warning-count').textContent=ww;
  document.getElementById('critical-count').textContent=cc;
}
function updateData(d){
  const status=v(d,'Status')||d.status||(Array.isArray(d)?d:[]);
  if(!Array.isArray(status)) return;
  status.forEach(c=>{ const n=v(c,'Name'); if(n) chains[n]=c; });
  render();
}
fetch(STATE_URL).then(r=>r.json()).then(d=>{
  updateData(d);
  const n = Object.keys(chains).length;
  addLog('Loaded '+n+' chain'+(n!==1?'s':'')+' from /state','ok');
}).catch(e=>addLog('Fetch /state: '+e.message,'error'));
let lastLogTs = 0;
function pollLogs(){
  fetch(LOGS_URL).then(r=>r.json()).then(arr=>{
    if(!Array.isArray(arr)||!arr.length) return;
    // Backend sends newest-first; render new ones (oldest->newest so newest ends on top)
    const fresh = arr.filter(x=>(v(x,'ts')||v(x,'Ts')||0) > lastLogTs);
    fresh.reverse().forEach(x=>{
      const msg = v(x,'msg')||v(x,'Msg')||'';
      const ts = v(x,'ts')||v(x,'Ts');
      const lvl = msg.includes('error')||msg.includes('❌')?'error':(msg.includes('not synced')||msg.includes('⚠')?'warn':'info');
      addLog(msg, lvl, ts);
      if(ts>lastLogTs) lastLogTs=ts;
    });
  }).catch(()=>{});
}
pollLogs();
setInterval(pollLogs, 3000);
function wsConnect(){
  const ws=new WebSocket(WS_URL);
  ws.onopen=()=>{
    document.getElementById('ws-status').textContent = 'Live';
    addLog('WebSocket connected','ok');
  };
  ws.onmessage=(e)=>{
    try{
      const d=JSON.parse(e.data);
      if(v(d,'msgType')==='update'){
        updateData(d);
      } else if(v(d,'msg')||v(d,'Msg')){
        const m=v(d,'msg')||v(d,'Msg'); addLog(m, m.includes('❌')?'error':'info', v(d,'ts')||v(d,'Ts'));
      } else if(v(d,'Name')){
        chains[v(d,'Name')]=d; render();
      }
    }catch(_){addLog('Parse error','error');}
  };
  ws.onclose=()=>{
    document.getElementById('ws-status').textContent = 'Reconnecting';
    setTimeout(wsConnect, 3000);
  };
  ws.onerror = ()=>{ addLog('WS error','error'); ws.close(); };
}
wsConnect();
</script>
</body>
</html>
