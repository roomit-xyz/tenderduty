# TenderDuty v2 Roomit — docker-compose
# Single monolithic service, no Caddy needed for internal use.

version: "3.8"

services:
  tenderduty:
    build: .
    container_name: tenderduty-v2
    ports:
      - "8888:8888"   # Dashboard
      - "28686:28686" # Prometheus exporter
    volumes:
      - ./config.yml:/app/config.yml:ro
    environment:
      - TZ=Asia/Jakarta
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/state"]
      interval: 30s
      timeout: 10s
      retries: 3
