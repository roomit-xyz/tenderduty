# TenderDuty v2 Roomit — docker-compose
# FHS: bin/ conf/ var/www/td2-v2/
# Single service, no Caddy needed for internal use.

version: "3.8"

services:
  tenderduty:
    build: .
    container_name: tenderduty-v2
    ports:
      - "8888:8888"   # Dashboard
      - "28686:28686" # Prometheus exporter
    volumes:
      - ./conf/config.yml:/app/conf/config.yml:ro
    environment:
      - CONFIG=/app/conf/config.yml
      - TENDERDUTY_STATIC_DIR=/app/var/www/td2-v2
      - TZ=Asia/Jakarta
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/state"]
      interval: 30s
      timeout: 10s
      retries: 3
