---
# =============================================================================
# TenderDuty v2 Roomit — example config
# Copy to conf/config.yml and edit. Supports:
#   - Tendermint / Cosmos SDK chains
#   - AtomOne (custom signing parser)
#   - Gno.land (TM2 polling, custom signing parser)
#
# FHS layout used:
#   bin/tenderduty              — binary
#   conf/config.yml             — this file
#   var/www/td2-v2/             — dashboard static files (index.html)
#   var/log                     — runtime logs
# =============================================================================

# controls whether the dashboard is enabled.
enable_dashboard: yes
# What TCP port the dashboard will listen on. Only the port is controllable for now.
listen_port: 8888
# hide_logs is useful if the dashboard will be posted publicly. It disables the log feed,
# and obscures most node-related details. Be aware this isn't fully vetted for preventing
# info leaks about node names, etc.
hide_logs: no
# How long to wait before alerting that a node is down.
node_down_alert_minutes: 3
# Node Down alert Pagerduty Severity
node_down_alert_severity: critical

# Should the prometheus exporter be enabled?
prometheus_enabled: yes
# What port should it listen on? For now only port is configurable.
prometheus_listen_port: 28686

# -----------------------------------------------------------------------------
# Notifiers (global). Set enabled: yes and per-channel config to activate.
# Per-chain overrides live under each chain's `alerts:` block.
# -----------------------------------------------------------------------------

# PagerDuty
pagerduty:
  enabled: no
  api_key: aaaaaaaaaaaabbbbbbbbbbbbbcccccccccccc
  default_severity: alert

# Discord
discord:
  enabled: no
  webhook: https://discord.com/api/webhooks/999999999999999999/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz

# Telegram
telegram:
  enabled: no
  api_key: "5555555555:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
  channel: "-666666666"

# Slack
slack:
  enabled: no
  webhook: https://hooks.slack.com/services/AAAAAAAAAAAAAAAAAAAAAAA/bbbbbbbbbbbbbbbbbbbbbbbb

# Gotify
gotify:
  enabled: no
  server: https://gotify.example.com
  token: "Ao8eikae1aepe7IShaequu4dae4ae1ai"
  priority: 5

# -----------------------------------------------------------------------------
# Healthcheck (dead man's switch) — pinged at `ping_rate` seconds, so any
# outage > 2*ping_rate will trip the healthcheck endpoint.
# -----------------------------------------------------------------------------
healthcheck:
  enabled: no
  ping_url: https://hc-ping.com/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
  ping_rate: 60

# -----------------------------------------------------------------------------
# Authentication — OpenID Connect (OIDC) for dashboard
# When enabled, all dashboard routes (except /ws, /logs, /state) require login.
# -----------------------------------------------------------------------------
auth:
  enabled: false
  oidc:
    enabled: false
    provider_url: ""
    client_id: ""
    client_secret: ""
    redirect_url: ""
    scopes:
      - openid
      - profile
      - email

# =============================================================================
# Chains to monitor. One entry per chain. The display name is arbitrary;
# chain_id is validated against the RPC endpoint.
#
# blockchain_kind values:
#   - tendermint  → Tendermint / Cosmos SDK (default if omitted)
#   - atomone     → AtomOne (custom signing parser)
#   - gnoland     → Gno.land (also set chain_type: gno, gno_valopers_realm)
# =============================================================================
chains:

  # ----- Generic Tendermint / Cosmos SDK chain -----
  "Osmosis":
    chain_id: osmosis-1
    valoper_address: osmovaloper1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    public_fallback: no
    alerts:
      stalled_enabled: yes
      stalled_minutes: 10
      consecutive_enabled: yes
      consecutive_missed: 5
      consecutive_priority: critical
      percentage_enabled: no
      percentage_missed: 10
      percentage_priority: warning
      alert_if_inactive: yes
      alert_if_no_servers: yes
      pagerduty:
        enabled: yes
        api_key: ""
      discord:
        enabled: yes
        webhook: ""
      telegram:
        enabled: yes
        api_key: ""
        channel: ""
      slack:
        enabled: yes
        webhook: ""
      gotify:
        enabled: yes
        server: ""
        token: ""
        priority: 0
    nodes:
      - url: tcp://localhost:26657
        alert_if_down: yes
      - url: https://some-other-node:443
        alert_if_down: no

  # ----- AtomOne (CometBFT fork, custom signing) -----
  "AtomOne Testnet":
    chain_id: atomone-testnet-1
    blockchain_kind: atomone
    valoper_address: "atonevaloper1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    public_fallback: no
    alerts:
      stalled_enabled: yes
      stalled_minutes: 10
      consecutive_enabled: yes
      consecutive_missed: 5
      consecutive_priority: critical
      percentage_enabled: no
      percentage_missed: 10
      percentage_priority: warning
      alert_if_inactive: yes
      alert_if_no_servers: yes
      telegram:
        enabled: yes
      gotify:
        enabled: yes
    nodes:
      - url: http://10.35.4.199:16711
        alert_if_down: yes

  # ----- Gno.land (TM2 polling, realm-based valoper) -----
  "GNO.LAND Testnet-13":
    chain_id: test-13
    blockchain_kind: gnoland
    chain_type: gno
    gno_valopers_realm: gno.land/r/gnops/valopers
    valoper_address: g1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    public_fallback: no
    alerts:
      stalled_enabled: yes
      stalled_minutes: 10
      consecutive_enabled: yes
      consecutive_missed: 5
      consecutive_priority: warning
      percentage_enabled: yes
      percentage_missed: 10
      percentage_priority: warning
      alert_if_inactive: yes
      alert_if_no_servers: yes
    nodes:
      - url: http://10.35.4.196:26657
        alert_if_down: yes
